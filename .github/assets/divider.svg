<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="img" aria-label="divider">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260409"/>
      <stop offset="0.5" stop-color="#a31226"/>
      <stop offset="1" stop-color="#260409"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="4" y="3" fill="url(#bar)"/>
  <rect x="-120" y="1" width="120" height="8" rx="4" fill="#ffe9a8" opacity="0.8">
    <animate attributeName="x" values="-120;1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
