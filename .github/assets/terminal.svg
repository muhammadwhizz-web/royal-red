<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Animated terminal: the one-line install of Royal Red runs, prints ok for every step, and ends with: crown installed, run royal-red">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a10"/>
      <stop offset="1" stop-color="#1a060b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e294"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#926c16"/>
    </linearGradient>
    <radialGradient id="crownglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- window -->
  <rect x="0.75" y="0.75" width="758.5" height="428.5" rx="14" fill="#0d0508" stroke="#5a1420" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="758.5" height="40" rx="14" fill="url(#titlebar)"/>
  <rect x="0.75" y="26" width="758.5" height="14" fill="url(#titlebar)"/>

  <!-- traffic lights, royal palette -->
  <circle cx="28" cy="21" r="6.5" fill="#a31226"/>
  <circle cx="50" cy="21" r="6.5" fill="#d4af37"/>
  <circle cx="72" cy="21" r="6.5" fill="#7f1d1d"/>
  <text x="380" y="26" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#c98f86">royal-red : install</text>
  <line x1="0" y1="41" x2="760" y2="41" stroke="#5a1420" stroke-width="1"/>

  <g font-family="'SF Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5" xml:space="preserve">
    <!-- command, two wrapped lines -->
    <g opacity="0">
      <text x="28" y="84" fill="#f0d9d5"><tspan fill="#d4af37">$</tspan> curl -fsSL https://raw.githubusercontent.com/\<tspan fill="#8a554e" dx="4">&#8629;</tspan></text>
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="52" y="110" fill="#f0d9d5">muhammadwhizz-web/royal-red/main/install.sh | bash</text>
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    </g>

    <!-- steps -->
    <g opacity="0">
      <text x="28" y="150" fill="#cf9d94"><tspan fill="#d4af37">&#9656;</tspan> installing the bun runtime</text>
      <text x="330" y="150" fill="#d4af37">ok</text>
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.35s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="180" fill="#cf9d94"><tspan fill="#d4af37">&#9656;</tspan> cloning royal-red to your machine</text>
      <text x="378" y="180" fill="#d4af37">ok</text>
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.35s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="210" fill="#cf9d94"><tspan fill="#d4af37">&#9656;</tspan> creating the royal-red command</text>
      <text x="372" y="210" fill="#d4af37">ok</text>
      <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.35s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="240" fill="#cf9d94"><tspan fill="#d4af37">&#9656;</tspan> locking the key vault, AES-256-GCM</text>
      <text x="386" y="240" fill="#d4af37">ok</text>
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.35s" fill="freeze"/>
    </g>

    <!-- result -->
    <g opacity="0">
      <text x="28" y="288" fill="#f6e294" font-size="16">crown installed. now run:</text>
      <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="28" y="322" fill="#f0d9d5" font-size="17" font-weight="bold">  royal-red</text>
      <animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.4s" fill="freeze"/>
    </g>

    <!-- blinking cursor after the command -->
    <rect x="152" y="308" width="11" height="20" fill="#f6e294" opacity="0">
      <animate attributeName="opacity" values="1;0" dur="1.1s" begin="5.2s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- crown seal, bottom right, appears last -->
  <g opacity="0">
    <circle cx="692" cy="368" r="42" fill="url(#crownglow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" begin="5.4s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(672,354)">
      <path d="M2 20 L2 8 L11 15 L20 2 L29 15 L38 8 L38 20 Z" fill="url(#gold)"/>
      <rect x="2" y="22" width="36" height="6" rx="2.5" fill="url(#gold)"/>
      <circle cx="20" cy="7" r="2.6" fill="#a31226"/>
      <circle cx="7" cy="12" r="2.2" fill="#a31226"/>
      <circle cx="33" cy="12" r="2.2" fill="#a31226"/>
    </g>
    <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.6s" fill="freeze"/>
  </g>

  <!-- prompt line at bottom -->
  <text x="28" y="404" font-family="'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#8a554e">verified by the Royal Red installer, v1.9.1</text>
</svg>
