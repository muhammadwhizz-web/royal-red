<svg xmlns="http://www.w3.org/2000/svg" width="880" height="84" viewBox="0 0 880 84" role="img" aria-label="Royal Red footer seal: a gold crown between two shimmering lines, MIT licensed, yours to keep">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a1420" stop-opacity="0"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="rule2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#5a1420" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e294"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#926c16"/>
    </linearGradient>
  </defs>

  <rect x="40" y="33" width="330" height="2" fill="url(#rule)"/>
  <rect x="510" y="33" width="330" height="2" fill="url(#rule2)"/>

  <!-- traveling shimmer sparks -->
  <circle r="2.6" fill="#f6e294" opacity="0.9">
    <animateMotion path="M 40 34 L 370 34" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.6" fill="#f6e294" opacity="0.9">
    <animateMotion path="M 840 34 L 510 34" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- crown -->
  <g transform="translate(424,16)">
    <path d="M2 16 L2 6 L10 12 L16 1 L22 12 L30 6 L30 16 Z" fill="url(#gold3)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
    </path>
    <rect x="2" y="18" width="28" height="5" rx="2" fill="url(#gold3)"/>
    <circle cx="16" cy="5" r="2" fill="#a31226"/>
    <circle cx="5" cy="9" r="1.7" fill="#a31226"/>
    <circle cx="27" cy="9" r="1.7" fill="#a31226"/>
  </g>

  <text x="440" y="62" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-size="13" letter-spacing="4" fill="#b98d84">MIT LICENSED &#183; YOURS TO KEEP</text>
</svg>
