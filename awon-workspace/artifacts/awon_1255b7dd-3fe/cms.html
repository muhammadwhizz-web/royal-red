<script>
// Admin panel functionality
const adminPanel = {
  init() {
    this.loadItems();
    this.renderItems();
    this.setupEventListeners();
  },
  
  loadItems() {
    const stored = localStorage.getItem('workshopItems');
    this.items = stored ? JSON.parse(stored) : [
      {id: 1, title: 'Leather Journal Making', description: 'Learn to craft a beautiful leather-bound journal', price: '$120'},
      {id: 2, title: 'Book Repair Workshop', description: 'Master techniques to restore and repair old books', price: '$95'}
    ];
  },
  
  saveItems() {
    localStorage.setItem('workshopItems', JSON.stringify(this.items));
  },
  
  renderItems() {
    const container = document.getElementById('items-container');
    container.innerHTML = '';
    
    this.items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'bg-white dark:bg-gray-800 p-4 rounded-lg shadow';
      div.innerHTML = `
        <h3 class="text-lg font-bold">${item.title}</h3>
        <p class="text-gray-600 dark:text-gray-300">${item.description}</p>
        <p class="text-indigo-600 font-semibold">${item.price}</p>
        <div class="mt-2 flex space-x-2">
          <button onclick="adminPanel.editItem(${item.id})" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">Edit</button>
          <button onclick="adminPanel.deleteItem(${item.id})" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">Delete</button>
        </div>
      `;
      container.appendChild(div);
    });
  },
  
  setupEventListeners() {
    document.getElementById('add-item-btn').addEventListener('click', () => this.showAddForm());
    document.getElementById('cancel-btn').addEventListener('click', () => this.hideForm());
    document.getElementById('save-btn').addEventListener('click', () => this.saveItem());
  },
  
  showAddForm() {
    document.getElementById('form-title').textContent = 'Add New Workshop';
    document.getElementById('item-form').reset();
    document.getElementById('form-container').classList.remove('hidden');
  },
  
  editItem(id) {
    const item = this.items.find(i => i.id === id);
    if (item) {
      document.getElementById('form-title').textContent = 'Edit Workshop';
      document.getElementById('item-title').value = item.title;
      document.getElementById('item-description').value = item.description;
      document.getElementById('item-price').value = item.price;
      document.getElementById('form-container').classList.remove('hidden');
      this.editingId = id;
    }
  },
  
  deleteItem(id) {
    if (confirm('Are you sure you want to delete this workshop?')) {
      this.items = this.items.filter(i => i.id !== id);
      this.saveItems();
      this.renderItems();
    }
  },
  
  saveItem() {
    const title = document.getElementById('item-title').value;
    const description = document.getElementById('item-description').value;
    const price = document.getElementById('item-price').value;
    
    if (!title || !description || !price) {
      alert('Please fill in all fields');
      return;
    }
    
    if (this.editingId) {
      const index = this.items.findIndex(i => i.id === this.editingId);
      if (index !== -1) {
        this.items[index] = {id: this.editingId, title, description, price};
      }
      this.editingId = null;
    } else {
      const newId = Math.max(0, ...this.items.map(i => i.id)) + 1;
      this.items.push({id: newId, title, description, price});
    }
    
    this.saveItems();
    this.renderItems();
    this.hideForm();
  },
  
  hideForm() {
    document.getElementById('form-container').classList.add('hidden');
    document.getElementById('item-form').reset();
    this.editingId = null;
  }
};

// Initialize when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
  adminPanel.init();
});
</script>
